<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur du Code César</title>
  <link rel="stylesheet" href="assets/CSS.css">
</head>
<body>
  <div class="card">
    <h1>🔐 Convertisseur César</h1>
    <input type="text" id="inputText" placeholder="Entrez votre texte ici" />
    <div class="label">
      <span>Décalage :</span>
      <span id="shiftValue">3</span>
    </div>
    <input type="range" id="shift" min="1" max="25" value="3">
    <div class="toggle">
      <span>Déchiffrer</span>
      <label class="switch">
        <input type="checkbox" id="modeSwitch" checked>
        <span class="slider"></span>
      </label>
      <span>Chiffrer</span>
    </div>
    <div class="buttons">
      <button id="convertBtn">Convertir</button>
      <button id="resetBtn" style="background:#475569;">Réinitialiser</button>
    </div>
    <div class="result" id="result"></div>
  </div>
  <script src="assets/JS.js"></script>
</body>
</html>
